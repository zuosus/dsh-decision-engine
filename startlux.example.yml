# StartLux Decision 配置模板
#
# 用法：复制到数据目录，按需修改。
#   mkdir -p ~/.dsh/dsh-startlux-decision
#   cp startlux.example.yml ~/.dsh/dsh-startlux-decision/startlux.yml
#
# 数据目录（插件自动读取）：
#   ~/.dsh/dsh-startlux-decision/startlux.yml     配置
#   ~/.dsh/dsh-startlux-decision/telemetry.jsonl  决策记录
#
# 改完立即生效：每次工具调用前会检查 mtime，无需重启 DSH。

# 总开关：true 才开始工作（默认 false，不会擅自介入你的会话）
enabled: false

# shadow  = 只记录判断结果，绝不拦截（建议先用它观察一段时间）
# enforce = 真正执行 ask / deny
mode: shadow

# 接受三种写法，等价：
#   https://api.bamboonode.dev/v1
#   https://api.bamboonode.dev/v1/decisions
#   直接写域名也行，会自动补 https:// 和 /decisions
baseUrl: https://api.bamboonode.dev/v1/decisions

# 模型留空 = 自动（由服务端选当前默认决策模型）。
# 这样服务商将来换模型名时，本配置不会失效。
# 想固定某个模型，可填 startlux-decision-27b-autothink，
# 或在插件配置页用「获取」拉取列表后下拉选择。
model:

# 通常留空：密钥从 ~/.dsh/.credentials.yaml 统一读取（见 apiKeyEnv）。
# 只有临时覆盖时才在这里写明文。
apiKey: ""

# 去 ~/.dsh/.credentials.yaml 的 refs 段里找这个键名。
# 把 key 加进去（与 DEEPSEEK_API_KEY 等并列）即可，无需改动本文件：
#   refs:
#     BAMBOO_API_KEY: sk-你的key
apiKeyEnv: BAMBOO_API_KEY

# 超时预算（毫秒）：实测 p50≈0.7s、冷启动 p95≈6.4s。
# 超时会自动降级放行（不影响干活），连续失败还会进入冷却。
timeoutMs: 8000

# never = 不思考，最省 token（默认）
# auto  = 仅在不确定时思考
thinkMode: never

# ---- 以下为可选调优项，按需取消注释 ----
# cacheSize: 256            # 相同 state 命中缓存即 0 token，省 token 主力
# recentMessages: 4         # 带给模型的上下文条数，越少越省
# guardReadOnlyTools: [read, grep, glob, todo_write]   # 这些工具直接放行，不发请求
# guardDenyConfidence: 0.85 # 高风险判定为 deny 的置信门槛
# guardIrreversibleCeiling: 0.2  # 低风险但不可逆时的升级门槛
